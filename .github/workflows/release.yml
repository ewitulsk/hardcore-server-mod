name: Build & Release

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'src/**'
      - 'gradle.properties'
      - 'build.gradle'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else echo "tag=v$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Hardcore Server ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: build/libs/*.jar
          generate_release_notes: true
          body: |
            Server-side NeoForge mod for Minecraft 1.21.1. Drop the jar in your server's `mods/` folder. Players do **not** need to install anything (vanilla clients can join).
